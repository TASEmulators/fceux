name: macOS

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RCHEEVOS_VERSION: 'v12.5.0'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show runner macOS version
        run: |
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf sdl2 qt6 minizip libarchive x264 x265 ffmpeg
          echo "$(brew --prefix qt6)/bin" >> "$GITHUB_PATH"
          LIBARCHIVE_PREFIX="$(brew --prefix libarchive)"
          PKG_CONFIG_PATH="${PKG_CONFIG_PATH:+$PKG_CONFIG_PATH:}$(brew --prefix)/lib/pkgconfig:$LIBARCHIVE_PREFIX/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Fetch rcheevos (RetroAchievements)
        run: |
          RCHEEVOS_DIR="$RUNNER_TEMP/rcheevos"
          git clone --depth 1 --branch "$RCHEEVOS_VERSION" https://github.com/RetroAchievements/rcheevos.git "$RCHEEVOS_DIR"
          if [ ! -f "$RCHEEVOS_DIR/include/rc_client.h" ]; then
            echo "rcheevos checkout is incomplete at $RCHEEVOS_DIR"
            exit 1
          fi
          echo "RCHEEVOS_DIR=$RCHEEVOS_DIR" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          VERSION="$(perl scripts/fceuVersion.pl)"
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$VERSION"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt6)" \
            -DQT6=1 \
            -DRETRO_ACHIEVEMENTS=ON \
            -DRCHEEVOS_DIR="$RCHEEVOS_DIR" \
            -DCMAKE_PROJECT_VERSION_MAJOR="$VERSION_MAJOR" \
            -DCMAKE_PROJECT_VERSION_MINOR="$VERSION_MINOR" \
            -DCMAKE_PROJECT_VERSION_PATCH="$VERSION_PATCH" \
            -DCPACK_PACKAGE_VERSION_MAJOR="$VERSION_MAJOR" \
            -DCPACK_PACKAGE_VERSION_MINOR="$VERSION_MINOR" \
            -DCPACK_PACKAGE_VERSION_PATCH="$VERSION_PATCH"
          cmake --build build --parallel

      - name: Package DMG
        run: cpack --config build/CPackConfig.cmake -G DragNDrop

      - uses: actions/upload-artifact@v4
        with:
          name: fceux-macos
          path: fceux-*.dmg
          if-no-files-found: error

  publish-interim:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: interim-build-macos
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fceux-macos

      - name: Upload to interim-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          dmgs=(fceux-*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "Expected exactly one DMG, found ${#dmgs[@]}: ${dmgs[*]}"
            exit 1
          fi
          cp "${dmgs[0]}" fceux-Darwin.dmg
          gh release upload interim-build fceux-Darwin.dmg --clobber --repo "$GITHUB_REPOSITORY"
