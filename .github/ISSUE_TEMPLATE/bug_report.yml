name: Bug report
description: Report a problem with FCEUX
title: ""
labels: []
assignees: []
body:
  - type: dropdown
    id: gui
    attributes:
      label: GUI version
      description: Which FCEUX GUI are you using?
      options:
        - Qt GUI
        - Native Win32 GUI
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system/version and FCEUX version.
      placeholder: |
        OS and version:
        FCEUX version:

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
